
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Jpagina principal</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f8f0;
      text-align: center;
      padding: 40px;
    }

    h1 {
      color: #2f4f2f;
      margin-bottom: 30px;
    }

    .galeria {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    .galeria a {
      display: block;
      width: 300px;
      height: 200px;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }

    .galeria a:hover {
      transform: scale(1.05);
    }

    .galeria img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <h1>Jardín Botánico</h1>

  <div class="galeria">
    <a href="Español.html">
      <img src="./MX.png" alt="UNAM">
    </a>

    <a href="Ingles.html">
      <img src="./USA.svg" alt="Chapultepec">
    </a>
  </div>

</body>
</html>
